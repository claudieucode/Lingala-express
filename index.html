<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lingala Express</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ EN-TÊTE ═══ -->
  <header>
    <div class="header-inner">
      <div class="logo">
        <span class="logo-icon">🌿</span>
        <span class="logo-text">Lingala <strong>Express</strong></span>
      </div>
      <p class="tagline" id="tagline">Apprenez le lingala essentiel à Kinshasa</p>
      <!-- Bouton bascule de langue -->
      <button class="lang-toggle" id="langToggle" onclick="toggleLanguage()">
        <span id="langLabel">🇫🇷 Français</span>
      </button>
    </div>
  </header>

  <!-- ═══ BARRE DE RECHERCHE ═══ -->
  <section class="search-section">
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input
        type="text"
        id="searchInput"
        placeholder="Chercher un mot en lingala ou en français..."
        oninput="filterCards()"
      />
    </div>
  </section>

  <!-- ═══ FILTRES CATÉGORIES ═══ -->
  <section class="categories-section">
    <div class="categories-scroll">
      <button class="cat-btn active" data-cat="all" onclick="selectCategory(this)">
        Tout
      </button>
      <button class="cat-btn" data-cat="salutations" onclick="selectCategory(this)">
        👋 Salutations
      </button>
      <button class="cat-btn" data-cat="politesse" onclick="selectCategory(this)">
        🤝 Politesse
      </button>
      <button class="cat-btn" data-cat="marche" onclick="selectCategory(this)">
        🛒 Marché
      </button>
      <button class="cat-btn" data-cat="transport" onclick="selectCategory(this)">
        🚕 Transport
      </button>
      <button class="cat-btn" data-cat="urgences" onclick="selectCategory(this)">
        🚨 Urgences
      </button>
      <button class="cat-btn" data-cat="chiffres" onclick="selectCategory(this)">
        🔢 Chiffres
      </button>
    </div>
  </section>

  <!-- ═══ COMPTEUR ═══ -->
  <div class="results-count">
    <span id="resultsCount"></span>
  </div>

  <!-- ═══ GRILLE DE CARTES ═══ -->
  <main>
    <div class="cards-grid" id="cardsGrid">
      <!-- Les cartes sont générées par script.js -->
    </div>

    <!-- Message si aucun résultat -->
    <div class="no-results" id="noResults" style="display:none;">
      <span>😕</span>
      <p id="noResultsText">Aucun mot trouvé. Essayez une autre recherche.</p>
    </div>
  </main>

  <!-- ═══ PIED DE PAGE ═══ -->
  <footer>
    <p id="footerText">Lingala Express · Kinshasa, RDC · Apprenez, parlez, vivez 🌍</p>
  </footer>

  <!-- Scripts (data.js doit être chargé avant script.js) -->
  <script src="data.js"></script>
  <script src="script.js"></script>

</body>
</html>
